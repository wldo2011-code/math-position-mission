</style></head><body><main class="wrap"><header class="hero"><div class="muted">중1 수행평가 · 학생/교사 통합 체험판</div><h1>📐 학교 속 위치 관계 탐험대</h1><div class="muted">학교에서 발견한 위치 관계를 사진으로 인증해 보세요!</div><div class="tabs"><button class="btn" id="studentTab">학생용 모드</button><button class="btn secondary" id="teacherTab">교사용 모드</button></div></header><section id="content"></section></main>
<script>
const groups=[['점과 직선의 위치 관계','점과 직선은 어떤 관계일까?',['점이 직선 위에 있다','점이 직선 위에 있지 않다']],['한 평면에서 두 직선의 위치 관계','같은 평면 위의 두 직선을 찾아보자!',['한 점에서 만난다','일치한다','평행하다']],['공간에서 두 직선의 위치 관계','공간 속 두 직선을 찾아보자!',['한 점에서 만난다','일치한다','평행하다','꼬인 위치에 있다']],['공간에서 직선과 평면의 위치 관계','직선과 평면의 관계를 찾아보자!',['한 점에서 만난다','직선이 평면에 포함된다','평행하다']]];
const missions=groups.flatMap((g,gi)=>g[2].map((title,i)=>({id:`${gi}-${i}`,title,group:g[0],points:gi===2&&i===3?3:2})));const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(n,unit)=>Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}${unit}</option>`).join('');
let data={};try{data=JSON.parse(localStorage.getItem('math-mission-v4')||'{}')}catch{};data.students??={};const persist=()=>{try{localStorage.setItem('math-mission-v4',JSON.stringify(data))}catch(e){alert('저장 공간이 부족해요. 사진을 줄이거나 브라우저 저장 공간을 확인해 주세요.')}};
let mode='student',logged=null,admin=false,cls=1,selectedNum=null,editor=null,opened=[0,1,2,3],photoUrl=null,canvas,ctx,tool='pen',penColor='#ef4444',penWidth=5,drawing=false,history=[];
const sid=(c,n)=>`${c}-${n}`;const student=()=>data.students[logged];const record=(s)=>s?.records||{};const count=s=>Object.keys(record(s)).length;
function render(){ $('studentTab').className='btn'+(mode==='student'?'':' secondary');$('teacherTab').className='btn'+(mode==='teacher'?'':' secondary');if(mode==='student')renderStudent();else renderTeacher()}
$('studentTab').onclick=()=>{mode='student';editor=null;render()};$('teacherTab').onclick=()=>{mode='teacher';editor=null;render()};
function renderStudent(){if(!logged){$('content').innerHTML=`<div class="card"><h2>탐험 시작하기</h2><p class="muted">학년·반·번호를 선택하고 이름을 입력하세요.</p><div class="field"><label>학년</label><select><option>1학년</option></select></div><div class="grid"><div class="field"><label>반</label><select id="loginClass">${opts(7,'반')}</select></div><div class="field"><label>번호</label><select id="loginNum">${opts(23,'번')}</select></div></div><div class="field"><label>이름</label><input id="loginName" placeholder="이름을 입력하세요"></div><button class="btn wide" id="loginBtn">학생으로 입장하기</button></div><p class="notice">체험판의 데이터는 이 기기의 브라우저에만 저장됩니다. 다른 아이패드와 자동 공유되지 않습니다.</p>`;$('loginBtn').onclick=()=>{let c=+$('loginClass').value,n=+$('loginNum').value,name=$('loginName').value.trim();if(!name)return alert('이름을 입력해 주세요.');let id=sid(c,n),s=data.students[id];if(s&&s.name!==name&&!confirm(`${c}반 ${n}번에는 '${s.name}' 기록이 있습니다. 다른 이름으로 변경할까요?`))return;data.students[id]??={class:c,num:n,name,records:{},grades:{},submitted:false,graded:false};data.students[id].name=name;logged=id;persist();render()};return}
const s=student();if(editor){renderEditor();return}let html=`<div class="row between"><strong>1학년 ${s.class}반 ${s.num}번 ${esc(s.name)}</strong><button class="btn secondary" id="changeStudent">학생 변경</button></div><div class="hero"><div class="row between"><strong>나의 미션 인증 현황</strong><strong>${count(s)} / 12개</strong></div><div class="progress"><div style="width:${count(s)/12*100}%"></div></div></div>`;
groups.forEach((g,gi)=>{let n=g[2].filter((_,i)=>s.records[`${gi}-${i}`]).length;html+=`<div class="panel"><div class="head" data-toggle="${gi}"><div class="meta"><strong>${gi+1}. ${g[0]}</strong><div class="muted">${g[1]}</div></div><span class="pill">${n}/${g[2].length}</span><span>${opened.includes(gi)?'⌃':'⌄'}</span></div>${opened.includes(gi)?g[2].map((m,i)=>`<div class="mission" data-mission="${gi}-${i}"><div class="text"><strong>${i+1}. ${m}</strong><small>${s.records[`${gi}-${i}`]?'✓ 인증 완료 · 수정하기':'사진 인증하기'}</small></div><span class="camera">${s.records[`${gi}-${i}`]?'✅':'📷'}</span></div>`).join(''):''}</div>`});html+=s.submitted?`<div class="card good">✓ 최종 제출 완료 · ${count(s)}개 인증</div>`:`<button class="btn wide" id="finalSubmit" ${count(s)===0?'disabled':''}>최종 제출하기</button>`;$('content').innerHTML=html;$('changeStudent').onclick=()=>{logged=null;render()};document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{let x=+el.dataset.toggle;opened=opened.includes(x)?opened.filter(v=>v!==x):[...opened,x];render()});document.querySelectorAll('[data-mission]').forEach(el=>el.onclick=()=>{if(s.submitted)return alert('최종 제출한 결과물은 수정할 수 없습니다.');editor=el.dataset.mission;photoUrl=s.records[editor]?.image||null;render()});if($('finalSubmit'))$('finalSubmit').onclick=()=>{if(confirm(`${count(s)}개 인증을 최종 제출할까요? 제출 후에는 수정할 수 없습니다.`)){s.submitted=true;persist();render()}}}
function renderEditor(){let s=student(),m=missions.find(x=>x.id===editor),r=s.records[editor];$('content').innerHTML=`<button class="btn secondary" id="back">← 미션 목록</button><div class="card"><div class="muted">${m.group}</div><h2>${m.title}</h2></div><div class="card"><h3>사진 인증 방법 선택</h3><div class="grid"><button class="btn" id="takePhoto">📷 사진 찍기</button><button class="btn secondary" id="libraryPhoto">▧ 사진 보관함</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden"><input id="libraryInput" type="file" accept="image/*" class="hidden"><p class="notice">아이패드에서 카메라/보관함 선택 창은 브라우저와 기기 설정에 따라 다를 수 있어요.</p></div><div id="editingArea" ${photoUrl?'':'class="hidden"'}><div class="card"><h3>사진에 표시하기</h3><div class="canvasbox"><canvas id="drawingCanvas" width="800" height="600"></canvas></div><div class="tools"><button class="btn" id="penBtn">✏️ 펜</button><button class="btn secondary" id="eraserBtn">◻ 지우개</button><button class="btn secondary" id="undoBtn">↶ 되돌리기</button><button class="btn secondary" id="clearBtn">표시 지우기</button></div><div class="row">${['#f43f5e','#111827','#2563eb','#16a34a','#eab308','#ffffff'].map(c=>`<button class="color ${penColor===c?'selected':''}" style="background:${c}" data-color="${c}" aria-label="펜 색상"></button>`).join('')}</div><div class="field"><label>펜 굵기 <span id="widthValue">${penWidth}px</span></label><input id="penWidth" type="range" min="2" max="25" value="${penWidth}"></div><button class="btn wide" id="savePhoto">${r?'인증 수정 저장하기':'인증 제출하기'}</button>${r?'<button class="btn secondary wide" style="margin-top:8px" id="removePhoto">이 미션 인증 삭제</button>':''}</div></div>`;$('back').onclick=()=>{editor=null;render()};$('takePhoto').onclick=()=>$('cameraInput').click();$('libraryPhoto').onclick=()=>$('libraryInput').click();['cameraInput','libraryInput'].forEach(id=>$(id).onchange=e=>{let f=e.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{photoUrl=reader.result;$('editingArea').classList.remove('hidden');initCanvas(photoUrl)};reader.readAsDataURL(f)});if(photoUrl)initCanvas(photoUrl);}
function initCanvas(url){canvas=$('drawingCanvas');ctx=canvas.getContext('2d');let img=new Image();img.onload=()=>{const max=1100,scale=Math.min(1,max/img.width,max/img.height);canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));ctx.drawImage(img,0,0,canvas.width,canvas.height);history=[canvas.toDataURL('image/png')];bindDrawing()};img.src=url}
function snapshot(){history.push(canvas.toDataURL('image/png'));if(history.length>25)history.shift()};function restore(url){let img=new Image();img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height)};img.src=url}
function bindDrawing(){let pos=e=>{let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};canvas.onpointerdown=e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);snapshot();let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.strokeStyle=tool==='eraser'?'rgba(0,0,0,1)':penColor;ctx.lineWidth=penWidth*(canvas.width/800);ctx.lineCap='round';ctx.lineJoin='round';if(tool==='eraser')ctx.globalCompositeOperation='destination-out';ctx.stroke()};canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false;ctx.globalCompositeOperation='source-over'};$('penBtn').onclick=()=>{tool='pen';$('penBtn').className='btn';$('eraserBtn').className='btn secondary'};$('eraserBtn').onclick=()=>{tool='eraser';$('eraserBtn').className='btn';$('penBtn').className='btn secondary'};document.querySelectorAll('[data-color]').forEach(el=>el.onclick=()=>{penColor=el.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===el));tool='pen';$('penBtn').className='btn';$('eraserBtn').className='btn secondary'});$('penWidth').oninput=e=>{$('widthValue').textContent=(penWidth=+e.target.value)+'px'};$('undoBtn').onclick=()=>{if(history.length)restore(history.pop())};$('clearBtn').onclick=()=>{if(confirm('사진 위의 모든 표시를 지울까요?'))restore(history[0])};$('savePhoto').onclick=()=>{let s=student();let result=canvas.toDataURL('image/jpeg',.75);s.records[editor]={image:result,date:new Date().toISOString()};s.graded=false;persist();editor=null;photoUrl=null;render()};if($('removePhoto'))$('removePhoto').onclick=()=>{if(confirm('이 미션의 인증 사진을 삭제할까요?')){delete student().records[editor];persist();editor=null;photoUrl=null;render()}}}
function renderTeacher(){if(!admin){$('content').innerHTML=`<div class="card"><h2>🔒 교사 관리자 로그인</h2><p class="muted">두 선생님이 같은 관리자 화면을 사용할 수 있도록 설계된 체험판입니다.</p><div class="field"><label>관리자 비밀번호</label><input type="password" id="pw" placeholder="비밀번호 입력"></div><button class="btn wide" id="adminLogin">관리자 입장</button><p class="notice">주의: 이 체험판의 비밀번호 검사는 브라우저에서 이루어지므로 실제 보안 수단이 아닙니다.</p></div>`;$('adminLogin').onclick=()=>{if($('pw').value==='shinhwa2026!'){admin=true;selectedNum=null;render()}else alert('비밀번호가 일치하지 않습니다.')};return}let html=`<div class="row between"><h2>📋 교사 관리자</h2><button class="btn secondary" id="logout">로그아웃</button></div>`;if(selectedNum===null){html+=`<div class="card"><h3>학급별 학생 인증 현황</h3><div class="grid">${Array.from({length:7},(_,i)=>{let c=i+1,submitted=Object.values(data.students).filter(s=>s.class===c&&s.submitted).length;return `<button class="btn secondary" data-class="${c}">${c}반 · ${submitted}명 제출</button>`}).join('')}</div><div class="tools"><button class="btn outline" id="allCsv">전체반 CSV 저장</button><button class="btn outline" id="allExcel">전체반 엑셀(.xls) 저장</button></div><p class="notice">전체반 엑셀 파일은 1반~7반을 각각 시트로 구분합니다. CSV는 한 시트에 학급별로 정렬됩니다.</p></div>`}else if(selectedNum===0){html+=`<button class="btn secondary" id="backClasses">← 전체 학급</button><h2>1학년 ${cls}반 · 번호순 학생 목록</h2><div class="tools"><button class="btn outline" id="classCsv">${cls}반 CSV 저장</button><button class="btn outline" id="classExcel">${cls}반 엑셀(.xls) 저장</button></div><div class="roster">${Array.from({length:23},(_,i)=>{let n=i+1,s=data.students[sid(cls,n)];return `<button class="btn secondary" data-student="${n}">${n}번 ${esc(s?.name||'미등록')} · ${count(s)}/12개 · ${s?.graded?'채점 완료':s?.submitted?'제출 완료':'미제출'}</button>`}).join('')}</div>`}else{let s=data.students[sid(cls,selectedNum)],grades=s?.grades||{},total=missions.reduce((v,m)=>v+(grades[m.id]==='correct'?m.points:grades[m.id]==='partial'?1:0),0);html+=`<button class="btn secondary" id="backRoster">← ${cls}반 학생 목록</button><div class="card"><h2>${cls}반 ${selectedNum}번 ${esc(s?.name||'미등록')}</h2><p class="muted">인증 ${count(s)}/12개 · ${s?.submitted?'최종 제출':'미제출'} · ${s?.graded?'채점 완료':'채점 대기'}</p><div class="score">${total} / 25점</div></div>`;missions.forEach((m,i)=>{let r=s?.records[m.id],v=grades[m.id]||'none';html+=`<div class="card"><strong>${i+1}. ${m.title}</strong><p class="muted">${m.points}점 · ${r?'인증 있음':'인증 없음'}</p>${r?`<img alt="학생 인증 사진" src="${r.image}" style="width:100%;border-radius:10px;max-height:350px;object-fit:contain;background:#222">`:''}<div class="field"><label>채점</label><select data-grade="${m.id}"><option value="none" ${v==='none'?'selected':''}>미채점</option><option value="correct" ${v==='correct'?'selected':''}>정답 (${m.points}점)</option><option value="partial" ${v==='partial'?'selected':''}>부분 점수 (1점)</option><option value="wrong" ${v==='wrong'?'selected':''}>오답 (0점)</option></select></div></div>`});html+=`<button class="btn wide" id="saveGrade" ${s?'':'disabled'}>채점 저장하기</button>${s?.graded?'<p class="good">✓ 채점 완료</p>':''}`}$('content').innerHTML=html;$('logout').onclick=()=>{admin=false;selectedNum=null;render()};document.querySelectorAll('[data-class]').forEach(el=>el.onclick=()=>{cls=+el.dataset.class;selectedNum=0;render()});document.querySelectorAll('[data-student]').forEach(el=>el.onclick=()=>{selectedNum=+el.dataset.student;render()});if($('backClasses'))$('backClasses').onclick=()=>{selectedNum=null;render()};if($('backRoster'))$('backRoster').onclick=()=>{selectedNum=0;render()};if($('saveGrade'))$('saveGrade').onclick=()=>{let s=data.students[sid(cls,selectedNum)];s.grades={};document.querySelectorAll('[data-grade]').forEach(el=>s.grades[el.dataset.grade]=el.value);s.graded=true;persist();render()};if($('classCsv'))$('classCsv').onclick=()=>downloadCSV(cls);if($('allCsv'))$('allCsv').onclick=()=>downloadCSV(null);if($('classExcel'))$('classExcel').onclick=()=>downloadXLS(cls);if($('allExcel'))$('allExcel').onclick=()=>downloadXLS(null)}
function rowsFor(c){return Array.from({length:23},(_,i)=>{let n=i+1,s=data.students[sid(c,n)],g=s?.grades||{};return [1,c,n,s?.name||'',count(s),s?.submitted?'제출 완료':'미제출',s?.graded?'채점 완료':'미채점',...missions.map(m=>g[m.id]==='correct'?m.points:g[m.id]==='partial'?1:g[m.id]==='wrong'?0:''),missions.reduce((v,m)=>v+(g[m.id]==='correct'?m.points:g[m.id]==='partial'?1:0),0)]})}const headers=['학년','반','번호','이름','인증 개수','제출 상태','채점 상태',...missions.map((m,i)=>`${i+1}. ${m.title}`),'총점'];function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function downloadCSV(c){let rows=[headers,...(c?[...rowsFor(c)]:Array.from({length:7},(_,i)=>rowsFor(i+1)).flat())],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),c?`1학년_${c}반_채점.csv`:'1학년_전체반_채점.csv')}
